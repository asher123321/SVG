<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Task 5.1 - SVG Art Gallery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3f0;
      color: #252525;
    }
    header { text-align: center; margin: 8px auto 30px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; color: #666; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    figure {
      margin: 0;
      padding: 12px;
      background: white;
      border: 1px solid #e6e0dc;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,.06);
      text-align: center;
    }
    svg {
      display: block;
      width: 200px;
      height: 300px;
      max-width: 100%;
      margin: 0 auto 12px;
      border: 2px solid #ef958b;
      background: #fffdfb;
    }
    figcaption { font-weight: 700; font-size: 15px; padding: 4px 0 2px; }
    .sub { display: block; margin-top: 4px; color: #777; font-size: 12px; font-weight: 400; }
    footer { text-align: center; margin: 28px 0 4px; color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>SVG Art Gallery</h1>
    <p>Learning Task 5.1 — Combining SVG Elements</p>
  </header>

  <main class="gallery">
    <!-- 1. Line and Circle -->
    <figure>
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300" role="img" aria-label="Line and circle abstract art">
        <rect width="200" height="300" fill="#fffdfb"/>
        <g stroke="#ef958b" stroke-width="5" fill="none" stroke-linecap="round">
          <path d="M22 42 H174 M22 42 V258 M22 258 H178"/>
          <path d="M34 115 L165 115 M100 115 V225"/>
          <path d="M40 185 H164"/>
        </g>
        <g fill="#55b5b2" stroke="#ef958b" stroke-width="5">
          <circle cx="55" cy="42" r="24"/>
          <circle cx="145" cy="42" r="18"/>
          <circle cx="100" cy="115" r="28"/>
          <circle cx="52" cy="185" r="18"/>
          <circle cx="150" cy="258" r="25"/>
        </g>
      </svg>
      <figcaption>1. Line and Circle<span class="sub">line + circle</span></figcaption>
    </figure>

    <!-- 2. Circle and Rectangle -->
    <figure>
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300" role="img" aria-label="Circle and rectangle abstract art">
        <rect width="200" height="300" fill="#ef958b"/>
        <rect x="12" y="18" width="176" height="72" rx="4" fill="#55b5b2"/>
        <rect x="12" y="114" width="176" height="72" rx="4" fill="#55b5b2"/>
        <rect x="12" y="210" width="176" height="72" rx="4" fill="#55b5b2"/>
        <g fill="#f5c84f">
          <circle cx="38" cy="42" r="12"/><circle cx="88" cy="66" r="12"/><circle cx="138" cy="42" r="12"/>
          <circle cx="38" cy="138" r="12"/><circle cx="88" cy="162" r="12"/><circle cx="138" cy="138" r="12"/>
          <circle cx="38" cy="234" r="12"/><circle cx="88" cy="258" r="12"/><circle cx="138" cy="234" r="12"/>
        </g>
      </svg>
      <figcaption>2. Circle and Rectangle<span class="sub">circle + rectangle</span></figcaption>
    </figure>

    <!-- 3. Polyline and Circle -->
    <figure>
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300" role="img" aria-label="Polyline and circle abstract art">
        <rect width="200" height="300" fill="#fffdfb"/>
        <polyline points="0,35 35,70 70,35 105,70 140,35 175,70 200,45" fill="none" stroke="#55b5b2" stroke-width="20" stroke-linejoin="miter"/>
        <polyline points="0,115 35,80 70,115 105,80 140,115 175,80 200,105" fill="none" stroke="#f5c84f" stroke-width="18" stroke-linejoin="miter"/>
        <polyline points="0,195 35,160 70,195 105,160 140,195 175,160 200,185" fill="none" stroke="#ef514b" stroke-width="18" stroke-linejoin="miter"/>
        <polyline points="0,275 35,240 70,275 105,240 140,275 175,240 200,265" fill="none" stroke="#80665c" stroke-width="16" stroke-linejoin="miter"/>
        <g fill="#c3b8b4" stroke="#fffdfb" stroke-width="3">
          <circle cx="35" cy="95" r="13"/><circle cx="105" cy="95" r="13"/><circle cx="175" cy="95" r="13"/>
          <circle cx="35" cy="215" r="13"/><circle cx="105" cy="215" r="13"/><circle cx="175" cy="215" r="13"/>
        </g>
      </svg>
      <figcaption>3. Polyline and Circle<span class="sub">polyline + circle</span></figcaption>
    </figure>

    <!-- 4. Polygon and Ellipse -->
    <figure>
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300" role="img" aria-label="Polygon and ellipse abstract art">
        <rect width="200" height="300" fill="#fffdfb"/>
        <polygon points="0,18 35,55 70,18 105,55 140,18 175,55 200,28 200,90 175,63 140,100 105,63 70,100 35,63 0,95" fill="#55b5b2"/>
        <polygon points="0,110 35,75 70,110 105,75 140,110 175,75 200,105 200,155 175,125 140,160 105,125 70,160 35,125 0,158" fill="#f5c84f"/>
        <polygon points="0,170 35,135 70,170 105,135 140,170 175,135 200,165 200,220 175,190 140,225 105,190 70,225 35,190 0,222" fill="#ef514b"/>
        <g fill="#c3b8b4">
          <ellipse cx="35" cy="255" rx="20" ry="30"/>
          <ellipse cx="100" cy="255" rx="20" ry="30"/>
          <ellipse cx="165" cy="255" rx="20" ry="30"/>
        </g>
      </svg>
      <figcaption>4. Polygon and Ellipse<span class="sub">polygon + ellipse</span></figcaption>
    </figure>

    <!-- 5. Circle, Line and Rectangle -->
    <figure>
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300" role="img" aria-label="Circle line and rectangle abstract art">
        <rect width="200" height="300" fill="#fffdfb"/>
        <rect x="18" y="20" width="164" height="260" fill="none" stroke="#55b5b2" stroke-width="7"/>
        <rect x="32" y="42" width="136" height="55" fill="#f5c84f"/>
        <rect x="32" y="203" width="136" height="55" fill="#ef958b"/>
        <g stroke="#80665c" stroke-width="5" fill="none">
          <path d="M28 150 H172 M100 112 V188"/>
        </g>
        <g fill="#55b5b2" stroke="#ef958b" stroke-width="5">
          <circle cx="62" cy="70" r="15"/><circle cx="138" cy="70" r="15"/>
          <circle cx="100" cy="150" r="25"/>
          <circle cx="62" cy="230" r="15"/><circle cx="138" cy="230" r="15"/>
        </g>
      </svg>
      <figcaption>5. Circle, Line and Rectangle<span class="sub">circle + line + rectangle</span></figcaption>
    </figure>

    <!-- 6. Polyline and Polygon -->
    <figure>
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300" role="img" aria-label="Polyline and polygon abstract art">
        <rect width="200" height="300" fill="#fffdfb"/>
        <polygon points="0,0 200,0 160,48 120,12 80,48 40,12" fill="#ef958b"/>
        <polygon points="0,80 40,42 80,80 120,42 160,80 200,42 200,112 160,150 120,112 80,150 40,112 0,150" fill="#55b5b2"/>
        <polyline points="0,175 35,140 70,175 105,140 140,175 175,140 200,165" fill="none" stroke="#f5c84f" stroke-width="18" stroke-linejoin="miter"/>
        <polyline points="0,250 35,215 70,250 105,215 140,250 175,215 200,240" fill="none" stroke="#ef514b" stroke-width="18" stroke-linejoin="miter"/>
        <polygon points="0,285 40,250 80,285 120,250 160,285 200,250 200,300 0,300" fill="#80665c"/>
      </svg>
      <figcaption>6. Polyline and Polygon<span class="sub">polyline + polygon</span></figcaption>
    </figure>

    <!-- 7. All five SVG elements -->
    <figure>
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300" role="img" aria-label="Combined SVG elements abstract art">
        <rect width="200" height="300" fill="#fffdfb"/>
        <rect x="12" y="12" width="176" height="276" rx="5" fill="none" stroke="#ef958b" stroke-width="8"/>
        <polygon points="20,45 55,20 90,45 125,20 160,45 180,30 180,85 145,110 110,85 75,110 40,85 20,100" fill="#55b5b2"/>
        <polyline points="18,150 48,120 78,150 108,120 138,150 168,120 185,138" fill="none" stroke="#f5c84f" stroke-width="15" stroke-linejoin="miter"/>
        <rect x="28" y="190" width="144" height="68" fill="#ef958b" opacity=".8"/>
        <g fill="#c3b8b4" stroke="#fffdfb" stroke-width="3">
          <ellipse cx="58" cy="224" rx="17" ry="26"/>
          <ellipse cx="142" cy="224" rx="17" ry="26"/>
        </g>
        <g fill="#ef514b">
          <circle cx="48" cy="58" r="10"/><circle cx="100" cy="58" r="10"/><circle cx="152" cy="58" r="10"/>
        </g>
      </svg>
      <figcaption>7. Mixed SVG Elements<span class="sub">circle + rectangle + polyline + polygon + ellipse</span></figcaption>
    </figure>
  </main>

  <footer>Created with inline SVG — each graphic uses a 200 × 300 viewBox.</footer>
</body>
</html>
